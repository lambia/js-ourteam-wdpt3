<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Our Team</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;600&family=Vidaloka&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="css/style.css" />
</head>

<body>
	<ul id="team-list">
		<!-- Qui facciamo una stampa di prova -->
	</ul>
	<div class="container">
		<section id="team">
			<h2 class="section-title">Our team</h2>
			<p class="section-description">
				Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent in varius ante. Sed quis luctus eros.
				Phasellus rutrum laoreet leo in consequat.
			</p>
			<div class="team-container">

				<!-- Qui andranno tutte le card generate via JS -->
				<!--
				<div class="team-card">
					<div class="card-image">
						<img src="img/wayne-barnett-founder-ceo.jpg" alt="Wayne Barnett" />
					</div>
					<div class="card-text">
						<h3>Wayne Barnett</h3>
						<p>Founder & CEO</p>
					</div>
				</div>
				-->

			</div>
		</section>
		<!-- Sezione per il form -->
		<section class="form-container">
			<h2>Add Team Member</h2>
			<form id="member-form">
				<div>
					<input type="text" id="name" placeholder="Nome completo" required>
				</div>
				<div>
					<input type="text" id="role" placeholder="Ruolo" required>
				</div>
				<div>
					<input type="text" id="image" placeholder="Url dell'immagine" required>
				</div>
				<button type="submit">Aggiungi membro</button>
			</form>
		</section>
	</div>
	<script src="js/script.js"></script>
</body>

</html>
